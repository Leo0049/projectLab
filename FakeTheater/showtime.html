<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>場次查詢 - 電影購票系統</title>
    <link rel="icon" href="pic/favicon.svg" type="image/svg+xml">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
</head>

<body>

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"> FakeTheater</a>
            <button class="navbar-toggler collapsed" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <!-- Mobile only links -->
                    <li class="nav-item d-lg-none">
                        <a class="nav-link" href="showtime.html">場次查詢</a>
                    </li>
                    <li class="nav-item d-lg-none">
                        <a class="nav-link" href="schedule.html">電影時刻表</a>
                    </li>
                    <li class="nav-item d-lg-none">
                        <a class="nav-link" href="booking.html">線上訂票</a>
                    </li>
                    <hr class="d-lg-none text-white-50">
                    <!-- 動態內容由 auth.js 生成 -->
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="nav-register-btn">註冊</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-outline-light btn-sm ms-2" href="#" id="nav-login-btn">登入</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Left Sidebar -->
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="sidebarstyle nav-link border-bottom text-white my-2  
                            d-flex justify-content-center align-items-center rounded-top fs-5"
                                href="showtime.html">場次查詢</a>
                        </li>
                        <li class="nav-item">
                            <a class="sidebarstyle nav-link border-bottom text-white my-2 
                            d-flex justify-content-center align-items-center rounded-top fs-5"
                                href="schedule.html">電影時刻表</a>
                        </li>
                        <li class="nav-item">
                            <a class="sidebarstyle nav-link border-bottom text-white my-2 
                            d-flex justify-content-center align-items-center rounded-top fs-5"
                                href="booking.html">線上訂票</a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main Content Area -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div
                    class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">場次查詢</h1>
                </div>

                <!-- Search Form -->
                <div class="card mb-4">
                    <div class="card-header">
                        查詢條件
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label for="search-movie" class="form-label">選擇電影</label>
                                <select id="search-movie" class="form-select">
                                    <option value="">所有電影</option>
                                    <!-- 動態載入 -->
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="search-date" class="form-label">選擇日期</label>
                                <input type="date" id="search-date" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label for="search-theater" class="form-label">選擇影廳</label>
                                <select id="search-theater" class="form-select">
                                    <option value="">所有影廳</option>
                                    <option value="1">1廳</option>
                                    <option value="2">IMAX廳</option>
                                    <option value="3">VIP廳</option>
                                </select>
                            </div>
                        </div>
                        <div class="mt-3">
                            <button id="search-btn" class="btn btn-primary">
                                查詢場次
                            </button>
                            <button id="reset-btn" class="btn btn-secondary ms-2">
                                重設條件
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Movie Info Section (shows when movie selected) -->
                <div id="movie-info-section" class="card mb-4" style="display: none;">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-3 col-4">
                                <img id="showtime-movie-poster" src="" alt="" class="img-fluid rounded shadow">
                            </div>
                            <div class="col-md-9 col-8">
                                <h4 id="showtime-movie-title" class="mb-2"></h4>
                                <div class="mb-2">
                                    <span class="badge bg-warning text-dark">⭐ <span
                                            id="showtime-movie-rating"></span>/10</span>
                                    <span class="badge bg-info" id="showtime-movie-duration"></span>
                                    <span class="badge bg-secondary" id="showtime-movie-class"></span>
                                </div>
                                <p id="showtime-movie-description" class="text-muted small mb-0"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Search Results -->
                <h4 class="mb-3">查詢結果</h4>
                <div id="showtime-results" class="row">
                    <!-- Results will be rendered here by JavaScript -->
                </div>

            </main>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/wallet-sidebar.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/showtime.js"></script>
</body>

</html>
