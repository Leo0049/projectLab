<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人專區 - 電影購票系統</title>
    <link rel="icon" href="pic/favicon.svg" type="image/svg+xml">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
</head>

<body>

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">FakeTheater</a>
            <button class="navbar-toggler collapsed" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <!-- 動態內容由 auth.js 生成 -->
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="nav-register-btn">註冊</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-outline-light btn-sm ms-2" href="#" id="nav-login-btn">登入</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Left Sidebar -->
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                <!-- 由 js/sidebar.js 產生 -->
            </nav>

            <!-- Main Content Area -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div
                    class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">個人專區</h1>
                </div>

                <!-- Balance -->
                <div class="balance-card p-4 mb-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
                    <div>
                        <div class="balance-label">當前餘額</div>
                        <div class="balance-amount">NT$ <span id="current_amount" class="user-balance">0</span></div>
                    </div>
                    <button class="btn btn-primary btn-lg" id="nav-deposit-btn">儲值</button>
                </div>

                <!-- Stats -->
                <div class="row g-3 mb-4">
                    <div class="col-md-3 col-6">
                        <div class="stat-card">
                            <div class="stat-label">可使用票券</div>
                            <div class="stat-value is-gold" id="stat-unused">0</div>
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="stat-card">
                            <div class="stat-label">已使用票券</div>
                            <div class="stat-value" id="stat-used">0</div>
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="stat-card">
                            <div class="stat-label">已退票</div>
                            <div class="stat-value" id="stat-refunded">0</div>
                        </div>
                    </div>
                    <div class="col-md-3 col-12">
                        <div class="stat-card">
                            <div class="stat-label">累計消費</div>
                            <div class="stat-value is-green">NT$ <span id="stat-spent">0</span></div>
                        </div>
                    </div>
                </div>

                <!-- Profile Update -->
                <div class="row">
                    <div class="col-lg-12">
                        <div class="card mb-4">
                            <div class="card-header">
                                修改用戶資料
                            </div>
                            <div class="card-body">
                                <form id="update-profile-form">
                                    <div class="row">
                                        <div class="col-md-8">
                                            <label for="usernameUpdate" class="form-label">新用戶名</label>
                                            <input type="text" class="form-control" id="usernameUpdate"
                                                placeholder="輸入新名稱">
                                        </div>
                                        <div class="col-md-4 d-flex align-items-end">
                                            <button id="changeUsername" type="submit" class="btn btn-primary w-100">
                                                更新用戶名
                                            </button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Transaction History -->
                <div class="card">
                    <div class="card-header">
                        消費紀錄
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover" id="transaction-table">
                                <thead class="table-dark">
                                    <tr>
                                        <th>#</th>
                                        <th>類型</th>
                                        <th>電影</th>
                                        <th>日期 / 場次</th>
                                        <th>金額</th>
                                        <th>時間</th>
                                    </tr>
                                </thead>
                                <tbody id="transaction-list">
                                    <!-- 動態載入 -->
                                </tbody>
                            </table>
                        </div>
                        <div id="transaction-sentinel"></div>
                        <div id="no-transactions" class="empty-state" style="display: none;">
                            <span class="empty-icon">🧾</span>
                            <p class="mb-1">暫無消費紀錄</p>
                            <p class="small mb-3">儲值或購票之後，紀錄會顯示在這裡。</p>
                            <a href="booking.html" class="btn btn-primary btn-sm">立即訂票</a>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/wallet-sidebar.js"></script>
    <script src="js/infinite-scroll.js"></script>
    <script src="js/footer.js"></script>
    <script>
        // 個人專區：票券統計、消費紀錄（無限滾動）、金流付款回來的處理
        const TRANSACTION_PAGE_SIZE = 15;

        document.addEventListener('DOMContentLoaded', async function () {
            await AuthManager.ready;

            if (!AuthManager.isLoggedIn()) {
                window.location.replace('index.html');
                return;
            }

            const user = AuthManager.getUser();
            document.getElementById('current_amount').textContent = user.balance;

            const usernameInput = document.getElementById('usernameUpdate');
            usernameInput.placeholder = user.username;

            await handlePaymentReturn();

            setupTransactionScroll();
            loadTicketStats();

            document.getElementById('update-profile-form').addEventListener('submit', async function (e) {
                e.preventDefault();
                const newName = usernameInput.value.trim();

                if (!newName) {
                    AuthManager.showToast('請輸入有效的名稱', 'warning');
                    return;
                }

                const result = await AuthManager.updateUsername(newName);
                if (result.success) {
                    AuthManager.showToast('用戶名已更新！', 'success');
                    usernameInput.value = '';
                    usernameInput.placeholder = newName;
                } else {
                    AuthManager.showToast(result.message || '更新失敗', 'danger');
                }
            });
        });

        /**
         * 從金流商付款完導回來時，網址會帶 order 與 result。
         * 但真正的入帳是靠伺服器對伺服器的回調，所以這裡要向後端確認訂單狀態，
         * 不能直接相信網址上的 result 參數。
         */
        async function handlePaymentReturn() {
            const params = new URLSearchParams(window.location.search);
            const orderNo = params.get('order');
            if (!orderNo) return;

            // 清掉網址參數，重新整理才不會又跳一次提示
            window.history.replaceState({}, '', window.location.pathname);

            try {
                const order = await DataAPI.getPaymentOrder(orderNo);

                if (order.status === 'paid') {
                    await AuthManager.refreshUser();
                    AuthManager.setBalance(AuthManager.getBalance());
                    document.getElementById('current_amount').textContent = AuthManager.getBalance();
                    AuthManager.showToast(`儲值成功，已入帳 NT$ ${order.amount}`, 'success');
                } else if (order.status === 'failed') {
                    AuthManager.showToast('付款失敗，訂單未完成', 'danger');
                } else {
                    AuthManager.showToast('付款結果處理中，請稍後重新整理', 'warning');
                }
            } catch (error) {
                AuthManager.showToast('無法確認付款結果', 'danger');
            }
        }

        // 票券統計
        async function loadTicketStats() {
            try {
                const stats = await DataAPI.getTicketStats();
                document.getElementById('stat-unused').textContent = stats.activeTickets;
                document.getElementById('stat-used').textContent = stats.usedTickets;
                document.getElementById('stat-spent').textContent = stats.totalSpent;
                document.getElementById('stat-refunded').textContent = stats.refundedTickets;
            } catch (error) {
                console.error('載入票券統計失敗:', error);
            }
        }

        // 消費紀錄：捲到底自動載入更多
        function setupTransactionScroll() {
            const tbody = document.getElementById('transaction-list');
            const noTransactions = document.getElementById('no-transactions');
            let rowIndex = 0;

            new InfiniteScroll({
                container: document.getElementById('transaction-sentinel'),
                pageSize: TRANSACTION_PAGE_SIZE,
                loadPage: async (offset, limit) => {
                    const page = await DataAPI.getTransactionPage({ limit, offset });
                    return { items: page.transactions, total: page.total, hasMore: page.hasMore };
                },
                render: (transactions, { isFirstPage }) => {
                    if (isFirstPage) {
                        tbody.innerHTML = '';
                        rowIndex = 0;
                        noTransactions.style.display = 'none';
                    }
                    tbody.insertAdjacentHTML('beforeend',
                        transactions.map(t => renderTransactionRow(t, ++rowIndex)).join(''));
                },
                onEmpty: () => {
                    tbody.innerHTML = '';
                    noTransactions.style.display = 'block';
                }
            }).reset();
        }

        function renderTransactionRow(t, index) {
            const isIncome = t.amount > 0;
            const badgeClass = t.type === '退票' ? 'bg-info' : (isIncome ? 'bg-success' : 'bg-warning');

            return `
                <tr>
                    <td>${index}</td>
                    <td><span class="badge ${badgeClass}">${escapeHtml(t.type)}</span></td>
                    <td class="small">${escapeHtml(t.movieTitle) || '-'}</td>
                    <td class="small">${t.movieDate ? escapeHtml(`${t.movieDate} ${t.showtime || ''}`) : '-'}</td>
                    <td class="${isIncome ? 'text-success' : 'text-danger'} fw-bold">
                        ${isIncome ? '+' : ''}$${t.amount}
                    </td>
                    <td class="text-muted small">${escapeHtml(t.createdAt)}</td>
                </tr>
            `;
        }
    </script>
</body>

</html>
