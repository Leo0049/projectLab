# Render Blueprint
#
# 使用方式：Render 後台 → New → Blueprint → 選這個 repo，
# 它會讀取本檔案自動建立服務。建立後只需要手動補一個環境變數（見下方 PUBLIC_URL）。
#
# 服務起來後請到 Render 後台的 Environment 頁面複製 ADMIN_PASSWORD 的值，
# 那是自動產生的隨機密碼，管理後台要用它登入。

services:
  - type: web
    name: faketheater
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health

    # free 方案不支援持久化磁碟，重新部署或服務休眠後資料會回到種子狀態。
    # 對展示來說沒問題（每次啟動都會重新匯入電影並排入未來 7 天場次）。
    # 想保留使用者訂票紀錄的話，把方案改成 starter 並解開下面這段：
    #
    # disk:
    #   name: faketheater-data
    #   mountPath: /data
    #   sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production

      # 對應 Dockerfile 裡的 /data；掛了磁碟就會落在磁碟上
      - key: DB_PATH
        value: /data/faketheater.db

      # Render 的反向代理會送 X-Forwarded-Proto，
      # 不開這個的話 req.protocol 會是 http，對外網址就組錯了
      - key: TRUST_PROXY
        value: "1"

      # 由 Render 產生隨機值，不會出現在版控裡
      - key: JWT_SECRET
        generateValue: true

      # 管理後台的密碼。預設讓 Render 隨機產生（值在 Environment 頁面可以看到）。
      # 注意：本檔在版控裡，千萬不要把實際密碼寫成 value——那會連同歷史紀錄永久進到 repo。
      - key: ADMIN_PASSWORD
        generateValue: true

      # 沙盒金流。改成其他值就不會掛載模擬金流商的路由；
      # 對接真實金流商時，記得同時用 PAYMENT_HASH_KEY / PAYMENT_HASH_IV 帶入正式金鑰。
      - key: PAYMENT_PROVIDER
        value: sandbox

      # 收掉「模擬 Google 登入」按鈕：該按鈕會把所有訪客登入同一個共用展示帳號
      # （含其餘額與票券），公開網址上不該開啟（見 README 已知限制）。
      - key: DEMO_GOOGLE_LOGIN
        value: "false"

      # 第一次部署完成後，把 Render 給的網址（https://xxx.onrender.com）填進來。
      # sync: false 代表這個值由後台手動填，不寫在版控裡。
      - key: PUBLIC_URL
        sync: false
